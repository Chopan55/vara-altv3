name: VARA Agent Bridge

# Manager (OpenAI) + implementador (Claude Code) con aprobación humana.
# No despliega a producción, no toca master y no corre migraciones.
# Ver docs/VARA_AGENT_BRIDGE_V1.md.

on:
  workflow_dispatch:
    inputs:
      goal:
        description: 'Objetivo en lenguaje natural (vacío si retomás con resume_issue)'
        required: false
        type: string
      max_rounds:
        description: 'Rondas máximas (tope absoluto: 4)'
        required: false
        default: '4'
        type: string
      dry_run:
        description: 'Prueba: sin rama, sin commit, sin PR, sin issue'
        required: false
        default: false
        type: boolean
      resume_issue:
        description: 'Número del issue "VARA Agent — Approval Required" ya respondido, para retomar'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: vara-agent
  cancel-in-progress: false

jobs:
  agent:
    name: Correr agente
    # Solo Pancho puede lanzar corridas.
    if: github.actor == 'Chopan55'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (integracion, nunca master)
        uses: actions/checkout@v4
        with:
          ref: integracion
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias del proyecto (para las validaciones)
        run: npm ci

      - name: Dependencias del bridge
        run: npm ci --prefix tools/vara-agent

      - name: Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Correr el bridge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'sonnet' }}
          GOAL: ${{ inputs.goal }}
          MAX_AGENT_ROUNDS: ${{ inputs.max_rounds }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME_ISSUE: ${{ inputs.resume_issue }}
          BASE_BRANCH: integracion
        run: npm start --prefix tools/vara-agent

      - name: Registro de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vara-agent-run
          path: .agent-runs/
          if-no-files-found: ignore
          retention-days: 14

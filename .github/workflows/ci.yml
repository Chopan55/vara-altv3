name: CI

on:
  # Cualquier rama: lo que se prueba tiene que incluir la rama de producción (master)
  # y las de trabajo. Antes solo escuchaba main/altv3/vara-hardening y nunca corría en master.
  push:
    branches: ['**']
  pull_request:
    branches: [master, main, altv3, integracion]
  # El bridge de agentes lo dispara a mano (gh workflow run) porque los push y PR creados
  # con GITHUB_TOKEN no disparan CI por sí solos.
  workflow_dispatch:

# Una corrida nueva de la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Tipos · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El bridge de agentes (tools/vara-agent) tiene su propio tsconfig y dependencias; el tsconfig del proyecto lo excluye.
      - name: Install dependencies (bridge)
        run: npm ci --prefix tools/vara-agent

      - name: Typecheck
        run: npm run typecheck

      # Si el bridge no compila, el CI no puede quedar en verde.
      - name: Typecheck del bridge (tools/vara-agent)
        run: npm run typecheck --prefix tools/vara-agent

      # Falla con errores; los avisos se ven pero no bloquean (ver eslint.config.mjs).
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
